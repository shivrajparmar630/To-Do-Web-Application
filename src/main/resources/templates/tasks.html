<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Todo Application</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        .navbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #4f46e5;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 15px;
            color: #6b7280;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }


        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 65px 0;
        }


        /* ================= HERO ================= */

        .hero {
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 46px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: #111827;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 19px;
            color: #6b7280;
        }


        /* ================= ADD TASK ================= */

        .add-task {
            background: white;
            padding: 10px;

            border: 1px solid #e5e7eb;
            border-radius: 16px;

            display: flex;
            gap: 10px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);

            margin-bottom: 45px;
        }

        .add-task input {
            flex: 1;

            border: none;
            outline: none;

            font-size: 18px;
            padding: 18px;

            color: #111827;
            background: transparent;
        }

        .add-task input::placeholder {
            color: #9ca3af;
        }

        .add-btn {
            border: none;
            background: #4f46e5;
            color: white;

            padding: 0 28px;
            border-radius: 12px;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .add-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }


        /* ================= TASK HEADER ================= */

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .task-header h2 {
            font-size: 24px;
            font-weight: 750;
        }

        .task-count {
            background: #eef2ff;
            color: #4f46e5;

            padding: 8px 14px;
            border-radius: 20px;

            font-size: 14px;
            font-weight: 700;
        }


        /* ================= TASK CARD ================= */

        .task-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 15px;

            padding: 22px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;

            transition: 0.2s;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
        }

        .task-card:hover {
            border-color: #c7d2fe;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.08);
            transform: translateY(-2px);
        }


        /* ================= TASK TITLE ================= */

        .task-info {
            display: flex;
            align-items: center;
            gap: 15px;

            min-width: 0;
        }

        .task-icon {
            width: 42px;
            height: 42px;

            background: #eef2ff;
            color: #4f46e5;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .task-title {
            font-size: 19px;
            font-weight: 600;

            word-break: break-word;
        }

        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }


        /* ================= ACTION BUTTONS ================= */

        .actions {
            display: flex;
            gap: 9px;
            margin-left: 20px;
        }

        .actions form {
            margin: 0;
        }

        .btn {
            border: none;

            padding: 10px 16px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .complete-btn {
            background: #ecfdf5;
            color: #059669;
        }

        .complete-btn:hover {
            background: #d1fae5;
        }

        .undo-btn {
            background: #fffbeb;
            color: #d97706;
        }

        .undo-btn:hover {
            background: #fef3c7;
        }

        .delete-btn {
            background: #fef2f2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }


        /* ================= EMPTY STATE ================= */

        .empty {
            background: white;

            border: 1px dashed #d1d5db;
            border-radius: 15px;

            text-align: center;

            padding: 65px 20px;

            color: #6b7280;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .empty h3 {
            color: #374151;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .empty p {
            font-size: 16px;
        }


        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            margin-top: 55px;

            color: #9ca3af;
            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 5%;
            }

            .status {
                display: none;
            }

            .container {
                width: 92%;
                padding: 40px 0;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 16px;
            }

            .add-task {
                flex-direction: column;
                padding: 8px;
            }

            .add-task input {
                padding: 16px;
            }

            .add-btn {
                padding: 15px;
            }

            .task-card {
                align-items: flex-start;
                flex-direction: column;
                gap: 18px;
            }

            .actions {
                margin-left: 0;
                width: 100%;
            }

            .actions form {
                flex: 1;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        Task<span>Flow</span>
    </div>

    <div class="status">
        <div class="status-dot"></div>
        All systems operational
    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- HERO -->

    <section class="hero">

        <h1>
            Get things done.
        </h1>

        <p>
            Plan your day, manage your tasks, and stay productive.
        </p>

    </section>


    <!-- ADD TASK -->

    <form action="/" method="post" class="add-task">

        <input
                type="text"
                name="title"
                placeholder="What needs to be done?"
                required>

        <button
                type="submit"
                class="add-btn">

            + Add Task

        </button>

    </form>


    <!-- TASK HEADER -->

    <div class="task-header">

        <h2>
            Your Tasks
        </h2>

        <div
                class="task-count"
                th:text="${tasks.size()} + ' Tasks'">

            0 Tasks

        </div>

    </div>


    <!-- TASK LIST -->

    <div th:each="task : ${tasks}"
         class="task-card">


        <!-- TASK INFORMATION -->

        <div class="task-info">

            <div class="task-icon">

                <span th:if="${task.completed}">
                    ✓
                </span>

                <span th:unless="${task.completed}">
                    ○
                </span>

            </div>


            <span
                    class="task-title"
                    th:classappend="${task.completed} ? ' completed'"
                    th:text="${task.title}">

                Task Title

            </span>

        </div>


        <!-- ACTIONS -->

        <div class="actions">


            <!-- COMPLETE / UNDO -->

            <form
                    th:action="@{/toggle/{id}(id=${task.id})}"
                    method="post">

                <button
                        type="submit"
                        class="btn"
                        th:classappend="${task.completed}
                        ? ' undo-btn'
                        : ' complete-btn'">

                    <span th:if="${task.completed}">
                        ↩ Undo
                    </span>

                    <span th:unless="${task.completed}">
                        ✓ Complete
                    </span>

                </button>

            </form>


            <!-- DELETE -->

            <form
                    th:action="@{/delete/{id}(id=${task.id})}"
                    method="post">

                <button
                        type="submit"
                        class="btn delete-btn">

                    Delete

                </button>

            </form>

        </div>

    </div>


    <!-- EMPTY STATE -->

    <div
            th:if="${#lists.isEmpty(tasks)}"
            class="empty">

        <div class="empty-icon">
            ✓
        </div>

        <h3>
            You're all caught up!
        </h3>

        <p>
            Add a task above and start getting things done.
        </p>

    </div>


    <footer>
        TaskFlow • Simple. Focused. Productive.
    </footer>


</main>

</body>

</html>
